# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = app/migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to prepend to the lib name in the autogenerated model
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a corresponding .py file to be listed as revisions
# sourceless = false

# version location specification; this defaults to app/migrations/versions.
# version_locations = %(here)s/bar:%(here)s/bat:app/migrations/versions

# the length of the revision ID, 32 by default.
# rev_id_length = 32

# whether to use the "base" command name when generating a version ID
# full_version_id = false

# set to 'true' to allow the use of 'alembic_helpers' in the migration files
# use_alembic_helpers = false


[logging]
default_handler = console


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

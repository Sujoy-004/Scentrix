[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Scentrix-backend"
version = "0.0.1"
description = "Scentrix Backend API - AI-Driven Fragrance Discovery"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Scentrix Team", email = "dev@Scentrix.local"}
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib==1.7.4",
    "bcrypt==4.0.1",
    "pydantic-settings>=2.1.0",
    "pydantic[email]>=2.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.6",
    "numpy>=1.26.4,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.8",
    "mypy>=1.7.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "httpx2",
    "black>=23.12.0",
    "types-passlib",
    "types-python-jose",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.envs.default]
features = ["dev"]
scripts.api = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "C",     # flake8-comprehensions
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
]
ignore = [
    "E501",  # line too long
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_calls = false
disallow_incomplete_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=html --cov-report=term-missing"
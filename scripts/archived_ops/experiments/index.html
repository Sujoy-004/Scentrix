<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Perfume Scroll</title>
    <style>
        body {
            margin: 0;
            background: #000;
            /* Adjust this to control how much scrolling is needed to finish the video */
            height: 4000px; 
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1;
        }

        video {
            display: none; /* We keep it hidden and draw it to canvas for better performance */
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="scrollCanvas"></canvas>
    </div>

    <video id="v" preload="auto" muted playsinline>
        <source src="front.mp4" type="video/mp4">
    </video>

    <script>
        const canvas = document.getElementById('scrollCanvas');
        const context = canvas.getContext('2d');
        const video = document.getElementById('v');

        let targetTime = 0;
        let currentTime = 0;
        const smoothing = 0.08; // Lower = smoother/slower glide. Higher = more responsive.

        // Initialize Canvas size
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Main Animation Loop
        function render() {
            // Linear Interpolation (Lerp) for that smooth "gliding" effect
            currentTime += (targetTime - currentTime) * smoothing;
            
            if (video.readyState >= 2) {
                video.currentTime = currentTime;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
            }
            
            requestAnimationFrame(render);
        }

        window.addEventListener('scroll', () => {
            const scrollPos = window.pageYOffset;
            const maxScroll = document.body.offsetHeight - window.innerHeight;
            const scrollFraction = scrollPos / maxScroll;
            
            // Map scroll to video duration
            targetTime = scrollFraction * video.duration;
        });

        // Start the loop once metadata is loaded
        video.addEventListener('loadedmetadata', () => {
            requestAnimationFrame(render);
        });
    </script>
</body>
</html>

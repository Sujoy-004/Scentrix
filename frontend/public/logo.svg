<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#C9A86C" />
      <stop offset="50%" stopColor="#F0D090" />
      <stop offset="100%" stopColor="#8B4513" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  {/* Connection Strands */}
  <path d="M50 50 L20 30 M50 50 L80 30 M50 50 L50 85" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  {/* Aromatic Nodes (Droplets) */}
  <circle cx="50" cy="50" r="12" fill="url(#goldGradient)" filter="url(#glow)" />
  <circle cx="20" cy="30" r="6" fill="#C9A86C" />
  <circle cx="80" cy="30" r="6" fill="#F0D090" />
  <circle cx="50" cy="85" r="8" fill="#8B4513" />
</svg>
